<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HbAuth Online Client Test</title>
</head>
<body id="auth-container">
  <script type="importmap">
    {
      "imports": {
        "@hiveio/hb-auth": "/dist/hb-auth.js",
        "@hiveio/wax": "/node_modules/@hiveio/wax/wasm/dist/bundle/web.js"
      }
    }
  </script>
  <script type="module">
    import { OnlineClient } from '@hiveio/hb-auth';
    import { createHiveChain } from '@hiveio/wax';

    Object.defineProperties(window, {
      AuthOnlineClient: {
        get() {
          return OnlineClient;
        }
      },
      chain: {
        get() {
          // wax's 2 s default fails a test on one slow api.hive.blog reply;
          // 15 s rides out the public node's tail and fits the 30 s test timeout.
          return this.chainInstance || (this.chainInstance = createHiveChain({ apiTimeout: 15_000 }));
        }
      }
    });
  </script>
</body>
</html>
