<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HbAuth Offline Client Test</title>
</head>
<body id="auth-container">
  <script type="importmap">
    {
      "imports": {
        "@hiveio/hb-auth": "/dist/hb-auth.js",
        "@hiveio/wax": "/node_modules/@hiveio/wax/wasm/dist/bundle/web.js"
      }
    }
  </script>
  <script type="module">
    import { OfflineClient } from '@hiveio/hb-auth';
    import { createHiveChain } from '@hiveio/wax';

    Object.defineProperties(window, {
      AuthOfflineClient: {
        get() {
          return OfflineClient;
        }
      },
      chain: {
        get() {
          return this.chainInstance || (this.chainInstance = createHiveChain());
        }
      }
    });
  </script>
</body>
</html>
